theShift:
  eyebrow: "WHY WE ARE SHIFTING"
  headline: "Let's face the ugly truth.\nUI alone is not enough anymore."
  body: "The ugly truth is that product teams are still working through slow handoff models, even when AI-assisted tools, no-code platforms, and custom code workflows have changed how fast digital products can move from idea to launch.\n\nElux Space is shifting into a pragmatic AI product design practice — where the question isn't \"how do we use AI?\" but \"where does AI actually earn its place, and what happens when it's wrong?\" Product direction, UI, build logic, and AI feature decisions move together from the start."
  items:
    - title: "01 — AI IN YOUR PRODUCT IS A DECISION, NOT A DEFAULT"
      text: "A pragmatic product team decides where AI earns its place by doing a real job and where a button, a template, or a simple rule does the job better."
    - title: "02 — PRODUCTS ARE UNDERSTOOD THROUGH EXPERIENCE, NOT SCREENS"
      text: "Most clients cannot fully imagine the product from UI visuals alone. They need to experience the flow, try the interaction, and see how it works in context."
    - title: "03 — DESIGN AND BUILD CAN NO LONGER MOVE SEPARATELY"
      text: "UI made without build thinking loses time in translation. AI-native moves them closer so decisions get clear before they get expensive."
    - title: "04 — NO-CODE DID NOT REMOVE THE HARD PART"
      text: "It speeds shipping only when logic, structure, and implementation are clear. Without that, it's trial, cleanup, and workarounds."

aiNative:
  eyebrow: "THE OLD WAY VS THE PRAGMATIC WAY"
  headline: "Stop polishing screens.\nStart shipping."
  withoutLabel: "TRADITIONAL UI-FIRST AGENCY"
  withoutHeadline: "The product keeps almost launching."
  withoutItems:
    - title: "The brief turns into screens too fast"
      text: "You get polished interfaces before the product direction, scope, and launch priorities are clear, so the real product decisions still sit with your team."
    - title: "The agency solves the visuals, not the product"
      text: "You get cleaner layouts and stronger UI, but the user flow, product logic, edge cases, and experience gaps still need to be solved before the product can work."
    - title: "Feedback stays stuck on the surface"
      text: "Review rounds improve what people can see in the frame, but not always what users need to click, test, understand, or experience."
    - title: "Build still becomes your problem"
      text: "Once the screens are approved, your team still has to translate them into implementation decisions, technical constraints, missing states, and development-ready logic."
  withoutResult: "RESULT: DESIGNED, BUT STILL NOT LAUNCHED AFTER 6 WEEKS."
  withLabel: "ELUX AI NATIVE DESIGN"
  withHeadline: "One focused sprint to something real."
  withItems:
    - title: "Messy inputs become product direction"
      text: "Goals, references, user needs, constraints, and priorities get structured into clear scope, product flows, and launch decisions before the work gets trapped in surface-level design."
    - title: "Design solves how the product works"
      text: "Interface decisions are shaped around product logic, user actions, states, edge cases, and the experience people need to understand the product faster."
    - title: "AI speeds up the right parts"
      text: "Our AI-native workflow helps us structure inputs, explore directions, reduce manual back-and-forth, and move faster from idea to usable product direction while experienced designers decide what is useful, buildable, and worth shipping."
    - title: "One team, design to development"
      text: "Product experience, interface decisions, and implementation direction stay connected from the start, whether the output is Webflow, Framer, no-code, or custom code."
  withResult: "RESULT: SHIPPED THROUGH ONE FOCUSED DESIGN-TO-BUILD SPRINT."

