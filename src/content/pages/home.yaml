fitCheck:
  eyebrow: "FIT CHECK"
  headline: "Not for everyone.\nBuilt for a few."
  supportingCopy: "We do our best work with teams that have a real product problem, a clear owner, and the urgency to move. If that sounds like you, we will probably get along."
  builtFor:
    - title: "Teams with a real product problem"
      text: "We are built for SaaS, AI, and digital products that need clearer flows, stronger product experience, working AI features, or a better path to launch. Design problems, build problems, and AI product problems all count."
    - title: "Teams that can make decisions"
      text: "Our workflow moves fast, so feedback needs to be direct, useful, and tied to the product goal. If every decision needs five approval layers, the sprint will feel too fast."
    - title: "Briefs that start with users, not just features"
      text: "Messy notes are fine. What matters is the user problem, product goal, constraints, and the next useful move — including whether AI actually belongs in the solution."
    - title: "Teams that want design and build connected"
      text: "Product direction, UI, Webflow, Framer, no-code, or custom code and backend work better when they move in one workflow instead of disconnected handoffs. We are not the design agency that hands you a Figma file and wishes you luck."

process:
  eyebrow: "HOW WE WORK"
  headline: "Plan. Design. Build.\nIn one iteration."
  supportingCopy: "AI-native workflows help us move faster through the messy parts. Experienced designers and builders decide what is clear, useful, buildable, and worth shipping."
  steps:
    - time: "48H"
      timeLabel: "to scope"
      title: "Intake and direction"
      short: "Messy briefs become scoped work, mapped flows, and a first-ship plan."
      description: "Messy briefs, scattered inputs, half-formed ideas. We use AI tooling to structure scope, map user flows, and get to product direction faster than a traditional kickoff ever would. Less time aligning. More time building."
      deliverables:
        - "Scoped brief"
        - "Timeline"
        - "First-ship plan"
    - time: "DAY 1-6"
      timeLabel: "design + build"
      title: "Expert-led decisions"
      short: "AI accelerates the work. People who have shipped before decide what ships."
      description: "Every UX tradeoff, scope call, and product direction is made by someone who has shipped this before. AI accelerates the work. Experienced designers and builders decide what ships."
      deliverables:
        - "UX flows"
        - "UI screens"
        - "Production build"
    - time: "DAY 7"
      timeLabel: "live -> ongoing"
      title: "Design and build in one loop"
      short: "No handoff lag. UX, UI and build move together, ready to ship."
      description: "Design and frontend do not wait for each other. No handoff lag, no spec translation errors. UX, UI, and build decisions move together — so what comes out is ready to ship, not ready to review."
      deliverables:
        - "Public launch"
        - "Weekly improvements"
        - "Usage telemetry"
  loopShort: "Weekly cycles after launch. Each one trims friction and adds value."
  loopCopy: "After ship, we're not done. We're on weekly cycles. Each loop trims friction, adds value, and gets you closer to product-market fit."

