problemSolution:
  eyebrow: "WHERE ARE YOU RIGHT NOW?"
  headline: "Pick your situation.\nWe've shipped this before."
  rows:
    - id: "01"
      kicker: "YOU KNOW WHAT YOU NEED."
      headline: "You need someone who can actually do it."
      copy: "You've done enough research to know Elux is the right partner. You understand that a real product agency — one that combines design, build, and AI thinking — saves you time, cost, and coordination headache compared to stitching together separate vendors. You want one team, one timeline, one complete output."
      cta: "START A PROJECT"
    - id: "02"
      kicker: "YOU KNOW AI CAN HELP YOUR PRODUCT."
      headline: "You just don't have the team to do it."
      copy: "You've seen what AI workflows can do for speed and cost. Maybe you've tried to incorporate it yourself, or planned to — but the capability gap is real. You need a team that actually knows how to use it, not one that just talks about it. We bring the capability. You focus on the product."
      cta: "LET'S BUILD IT"
    - id: "03"
      kicker: "YOU'VE STARTED BUILDING WITH AI."
      headline: "The output isn't what you expected."
      copy: "You started the build — with AI tools, vibe coding, or a mix. The output is inconsistent, not precise enough, and it's costing you more time than you saved. You need someone who can take what you have and turn it into something reliable. We fix the inconsistency and ship the product you actually meant to build."
      cta: "FIX THE OUTPUT"
    - id: "04"
      kicker: "YOUR PRODUCT IS LIVE."
      headline: "Now you want to scale it with AI."
      copy: "You've shipped. With or without AI assistance. But now you want to move beyond — add AI features, scale specific functions, or position the product properly as AI-native. Maybe you're looking at an AI wrapper SaaS, a dashboard, automation, or a mobile app. We help you decide what to build next and ship it."
      cta: "SCALE THE PRODUCT"

services:
  eyebrow: "SERVICES THAT MATCH THE STAGE"
  headline: "Pick your stage.\nWe'll meet you there."
  supportingCopy: "Whether you're still figuring out what to build, trying to fix what's broken, or scaling what already works — there's an engagement that fits where your product actually is right now."
  stages:
    - key: "Seed"
      headline: "Your first version. Shipped before it becomes your next year."
      sprint: "Typical sprint: 2 to 4 weeks"
      copy: "You've got the idea. Maybe a deck. Maybe a doc. Maybe just a voice note from a call that went well. That's enough to start. Two to four weeks later, you have a real product to show — not a prototype, not a concept. Something you can put in front of users."
      cta: "START A SEED SPRINT"
      services:
        - title: "01 Clarity on what to actually build first"
          text: "Your goals, constraints, and user context get structured into a scope that a team can act on — including where AI earns a place in the product and where it doesn't."
        - title: "02 User flows that make sense from day one"
          text: "The key screens, decision points, and product logic get mapped so your first users don't need a tutorial to get the value."
        - title: "03 An interface that looks like you meant it"
          text: "Visual direction, UI design, and landing page story come together so the first version earns trust — not just attention."
        - title: "04 Built and working — not just handed off"
          text: "We ship the product, not a file. From design-only to full custom code with backend and AI features — whichever gets your product live without creating technical debt you'll regret in six months."
    - key: "Growth"
      headline: "Your product is live. Users aren't staying. Let's fix that."
      sprint: "Typical sprint: 3 to 6 weeks"
      copy: "Something in the product is losing people. Onboarding, activation, a dashboard that's technically complete but functionally confusing. You know the drop-off is there — you just need someone to find it, fix it, and ship the improvement before another quarter passes."
      cta: "START A GROWTH SPRINT"
      services:
        - title: "01 A diagnosis, not a guess"
          text: "Friction across onboarding, activation, key flows, and dashboards gets identified systematically — including whether any AI features are working as intended, costing what they should, and doing a real job for users."
        - title: "02 Flows that actually move users forward"
          text: "The structure, content logic, and interaction decisions get redesigned so users get to the value without hitting a wall."
        - title: "03 Key screens and logic rebuilt around what users need"
          text: "Onboarding, activation, dashboards, or conversion-critical areas — redesigned and rebuilt with intent, not just cleaned up cosmetically. We fix the product, not just the visuals."
        - title: "04 Specs and working output your team can ship from"
          text: "Every redesign decision gets documented and, where needed, implemented. No translation layer. No \"what did they mean by this?\""
    - key: "Scale"
      headline: "Your team is growing. Design shouldn't slow them down."
      sprint: "Ongoing"
      copy: "Every new feature takes longer than it should because nobody can find the right component. Every new hire spends two weeks figuring out \"how we do things here.\" A scalable design system fixes both — and makes everything your team ships look like it belongs together."
      cta: "START A SCALE ENGAGEMENT"
      services:
        - title: "01 A system built around how your product actually works"
          text: "Not a generic component library dropped on your repo. Your screens, patterns, and recurring decisions get mapped into a structure that fits the product you have — and the one you're building toward."
        - title: "02 Components your team will actually use"
          text: "Reusable UI pieces with clear usage rules, edge case coverage, and documentation that doesn't require a 90-minute onboarding session to understand."
        - title: "03 Design and build that move together"
          text: "Product design decisions connect directly to implementation — across Webflow, Framer, no-code, or custom frontend and backend — so there's no spec translation lag between what's designed and what ships."
        - title: "04 AI where it earns its place — and nowhere else"
          text: "AI-assisted tooling and AI product features integrated into the places where they remove real friction, with cost and operability as constraints from the start — not bolted on to look modern."

